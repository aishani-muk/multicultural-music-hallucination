# Full config: both tracks at full scale. Intended for NEXUS SLURM runs.

seed: 848

paths:
  prompts: src/mhb/prompts/seed_prompts.json
  curated: outputs/curated
  generated_audio: outputs/generated_audio
  verification_results: outputs/verification_results
  final_scores: outputs/scores
  figures: outputs/figures

verifiers:
  - gemini
  - music_flamingo

gemini:
  model: gemini-2.5-pro
  requests_per_minute: 10
  max_retries: 5
  temperature: 0.0
  max_output_tokens: 320

music_flamingo:
  model_id: nvidia/audio-flamingo-3
  device: cuda
  torch_dtype: bfloat16
  max_new_tokens: 320

generation:
  model: facebook/musicgen-large
  duration_sec: 15
  guidance_scale: 3.0
  max_new_tokens: 1536
  batch_size: 4
  device: cuda
  torch_dtype: float16

evaluation:
  bootstrap_n: 2000
  alpha: 0.05
