# Canonical instrument names scoped by tradition.
# Fields:
#   aliases: alternate spellings / transliterations
#   family: string | wind | percussion | voice | keyboard | electronic
#   traditions: which traditions this instrument is *native* to
#   out_of_culture_for: traditions where presence would be a hallucination

